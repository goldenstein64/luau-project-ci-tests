name: Test

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "5.5", "luajit", "luajit-openresty"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    steps:
    # We are going to install
    # argparse from source
    # patched by https://github.com/luarocks/argparse/pull/33
    # to test argparse on Lua 5.5
    - uses: actions/checkout@master
      with:
        repository: luarocks/argparse

    - uses: ilammy/msvc-dev-cmd@v1
      if: ${{ runner.os == 'Windows' && !startsWith(matrix.luaVersion, 'luajit') }}

    - uses: luarocks/gh-actions-lua@master
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: luarocks/gh-actions-luarocks@master

    - name: Download argparse patch
      run: curl -kLO "https://github.com/luarocks/argparse/pull/33.patch"

    - name: Apply argparse patch
      run: git apply "33.patch"

    - name: Lint development rockspec
      run: luarocks lint "argparse-scm-2.rockspec"

    - name: Install the patched argparse
      run: luarocks make

    # We are going to install
    # luacov from source
    # patched by https://github.com/lunarmodules/luacov/pull/118
    # for the tests to pass on Lua 5.5
    - uses: actions/checkout@master
      with:
        repository: lunarmodules/luacov
        path: luacov-src

    - name: Download luacov patch
      working-directory: luacov-src
      run: curl -kLO "https://github.com/lunarmodules/luacov/pull/118.patch"

    - name: Apply luacov patch
      working-directory: luacov-src
      run: git apply "118.patch"

    - name: Install the patched luacov
      working-directory: luacov-src
      run: luarocks make

    # We are going to install
    # cluacov from source
    # patched by https://github.com/luarocks/cluacov/pull/7
    # for code coverage to pass on Lua 5.5
    - uses: actions/checkout@master
      with:
        repository: luarocks/cluacov
        path: cluacov-src

    - name: Download cluacov patch
      working-directory: cluacov-src
      run: curl -kLO "https://github.com/luarocks/cluacov/pull/7.patch"

    - name: Apply cluacov patch
      working-directory: cluacov-src
      run: git apply "7.patch"

    - name: Install the patched cluacov
      working-directory: cluacov-src
      run: luarocks make

    # We are going to install
    # luacheck from source
    # patched by https://github.com/lunarmodules/luacheck/pull/136
    # for linting to pass on Lua 5.5
    - uses: actions/checkout@master
      with:
        repository: lunarmodules/luacheck
        path: luacheck-src

    - name: Download luacheck patch
      working-directory: luacheck-src
      run: curl -kLO "https://github.com/lunarmodules/luacheck/pull/136.patch"

    - name: Apply luacheck patch
      working-directory: luacheck-src
      run: git apply "136.patch"

    - name: Install the patched luacheck
      working-directory: luacheck-src
      run: luarocks make

    - name: Install busted
      run: luarocks install busted

    - name: Run luacheck
      run: luacheck src spec

    - name: Run tests
      run: busted -c

    - name: Run code coverage
      run: luacov
